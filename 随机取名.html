<!DOCTYPE html>

    <style>
        body {
            font-family: 'Segoe UI', system-ui;
            margin: 0;
            padding: 20px;
            background-color: #f8f9fa;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
        }

        .control-group {
            flex-wrap: wrap;
            margin-bottom: 10px;
            background: white;
            border-radius: 8px;
            border: 1px solid #e9ecef;
            padding: 12px 0;
        }

        .inline-group {
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 32px;
            padding: 0 16px;
        }

        label {
            display: inline-flex;
            align-items: center;
            cursor: pointer;
            color: #4a4e69;
            white-space: nowrap;
        }

        input[type="checkbox"]:checked + span {
            color: #d90429;
        }

        #customSurname {
            margin-left: 5px;
            border: none;
            border-bottom: 1px solid #dee2e6;
            padding: 5px;
            width: 100px;
            transition: border-color 0.2s;
            font-size: 16px;
        }

        button {
            width: 100%;
            background: #3385ff;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 12px 30px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 16px;
        }

        button:hover {
            background: #317ef3;
        }

        #namesContainer {
            margin-top: 15px;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
        }

        .name-item {
            padding: 10px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            text-align: center;
            transition: background 0.2s;
            font-size: 16px;
            background: white;
        }

        .name-item:hover {
            background: #fff3b0 !important;
        }
    </style>
</head>

        // 获取当前性别
        function getGender() {
            return document.querySelector('input[name="gender"]:checked').value === '男' ? 'male' : 'female';
        }
    
        // 获取非姓氏的选中值
        function getSelectedValues(name) {
            const gender = getGender();
            const checkboxes = document.querySelectorAll(`input[name="${name}"]:checked`);
            
            if(checkboxes.length === 0) {
                const firstCheckbox = document.querySelector(`input[name="${name}"]`);
                firstCheckbox.checked = true;
                return data[name][firstCheckbox.value][gender];
            }
            
            return Array.from(checkboxes).flatMap(cb => 
                data[name][cb.value][gender]
            );
        }
    
        // 特殊处理姓氏数据
        function getSurnameValues() {
            const gender = getGender();
            const checkboxes = document.querySelectorAll('input[name="surname"]:not(#customSurnameCheck):checked');
            
            if(checkboxes.length === 0) {
                throw new Error('请至少选择一个姓氏类型');
            }
            
            return Array.from(checkboxes).flatMap(cb => 
                data.surname[cb.value][gender]
            );
        }
    
        // 生成名字函数
        function generateNames() {
            try {
                const gender = getGender();
                const isDouble = document.querySelector('input[name="type"]:checked').value === 'double';
                const useCustom = document.getElementById('customSurnameCheck').checked;
                
                // 处理姓氏
                let surnames = [];
                if(useCustom) {
                    const custom = document.getElementById('customSurname').value
                        .split(/[,\s]/)
                        .filter(s => s.trim());
                    if(custom.length === 0) throw new Error('请输入自定义姓氏');
                    surnames = custom;
                } else {
                    surnames = getSurnameValues();
                }
                
                // 获取首末字
                const firstChars = isDouble ? getSelectedValues('first') : [];
                const lastChars = getSelectedValues('last');
                
                // 生成60个不重复的名字
                const nameSet = new Set();
                while(nameSet.size < 60) {
                    const surname = surnames[Math.floor(Math.random() * surnames.length)];
                    const first = firstChars.length > 0 ? 
                        firstChars[Math.floor(Math.random() * firstChars.length)] : '';
                    const last = lastChars[Math.floor(Math.random() * lastChars.length)];
                    
                    if(surname && last) {
                        nameSet.add(surname + first + last);
                    }
                }
                
                // 显示结果
                document.getElementById('namesContainer').innerHTML = 
                    Array.from(nameSet).map(name => 
                        `<div class="name-item">${name}</div>`
                    ).join('');
                    
            } catch (error) {
                alert(error.message);
            }
        }
    
        // 事件监听
        document.getElementById('customSurname').addEventListener('focus', function() {
            // 清除其他姓氏选择
            document.querySelectorAll('input[name="surname"]:not(#customSurnameCheck)').forEach(cb => {
                cb.checked = false;
            });
            document.getElementById('customSurnameCheck').checked = true;
        });
    
        // 类型切换
        document.querySelectorAll('input[name="type"]').forEach(radio => {
            radio.addEventListener('change', () => {
                document.getElementById('firstCharGroup').style.display = 
                    radio.value === 'single' ? 'none' : 'flex';
            });
        });
    
        // 初始化显示
        document.getElementById('firstCharGroup').style.display = 'flex';
    </script>
